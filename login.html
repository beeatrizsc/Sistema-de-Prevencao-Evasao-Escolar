<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Login - Alerta Precoce</title>

  <!-- CSS do Bootstrap 4.4.1 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
  <!-- CSS Customizado da Aplicação -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <div class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        
        <!-- login -->
        <div class="card shadow border-0">
          
          <!-- cabeçalho -->
          <div class="card-header bg-azul-edtech text-white text-center py-4 border-0">
            <a href="index.html" class="d-inline-block">
              <img src="logo1.png" alt="Logo Alerta Precoce" style="height: 55px; width: auto;" class="mb-2">
            </a>
            <h4 class="font-weight-bold mb-0, text-white">Acesso ao Sistema</h4>
            <small class="text-white-50">Plataforma de Alerta Precoce</small>
          </div>
          <!-- formulário de login -->
          <div class="card-body p-4">
            <form onsubmit="fazerLogin(event)">
              <div class="form-group">
                <label for="email" class="font-weight-bold text-azul-ods">E-mail ou Usuário</label>
                <input type="email" class="form-control" id="email" placeholder="seu.email@escola.edu.br" required>
              </div>
              
              <div class="form-group">
                <label for="senha" class="font-weight-bold text-azul-ods">Senha</label>
                <input type="password" class="form-control" id="senha" placeholder="••••••••" required>
              </div>
              
              <div class="form-group">
                <label for="perfil" class="font-weight-bold text-azul-ods">Perfil de Acesso</label>
                <select class="form-control" id="perfil" required>
                  <option value="" selected disabled>Selecione seu perfil...</option>
                  <option value="direcao">Gestor</option>
                  <option value="assistente-social">Assistente Social</option>
                  <option value="professor">Professor</option>
                </select>
              </div>
              
              <button type="submit" class="btn bg-vermelho-ods text-white btn-block py-2 font-weight-bold mt-4 shadow-sm">
                Entrar no Painel
              </button>
            </form>
            <script>
            function fazerLogin(e) {
              e.preventDefault();
              const perfil = document.getElementById('perfil').value;
              localStorage.setItem('perfilUsuario', perfil);
              window.location.href = 'dashboard.html';
            }
</script>
          </div>

          <div class="card-footer text-center bg-white border-0 pb-3">
            <a href="index.html" class="small text-secondary font-weight-bold">&larr; Voltar para a Página Inicial</a>
          </div>

        </div>

      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"></script>
</body>
</html>
